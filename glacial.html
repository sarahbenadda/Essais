<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Kart — Glacial</title>
<style>
  html,body{margin:0;background:#193146;color:#e2f5ff;font-family:monospace}
  main{max-width:1024px;margin:8px auto;text-align:center;padding:0 8px}
  canvas{display:block;width:100%;height:auto;image-rendering:pixelated;background:#cadee8;
    border:3px solid #679fb8;box-sizing:border-box;touch-action:manipulation}
  p{font-size:14px;line-height:1.5;margin:8px 0 4px}
  button{border:1px solid #a4cedf;background:#2a6179;color:#edf9fd;
    padding:9px 17px;font:700 14px monospace;border-radius:4px;cursor:pointer}
</style>
</head>
<body>
<main><canvas id="game" width="1024" height="768" tabindex="0" aria-label="Mini Kart Glacial, jeu pour deux joueurs"></canvas>
<p>J1 : ZQSD (ou WASD) • J2 : flèches • Entrée : jouer • R : recommencer • Échap : menu</p>
<button id="play">JOUER / REJOUER</button> <button id="focus">ACTIVER LE CLAVIER</button>
</main>
<script>
'use strict';
const cv=document.getElementById('game'), g=cv.getContext('2d');
const W=1024,H=768,S=64,ROAD='#303949',GRASS='#cadde8';
const map=Array.from({length:12},()=>Array(16).fill('grass'));
const segment=(rows,cols,t='road')=>{for(const r of rows)for(const c of cols)map[r][c]=t};
const range=(a,b)=>Array.from({length:b-a},(_,i)=>a+i);
// Meme boucle que la grille Pygame : deux detours et passages sur glace.
segment([10,11],range(1,15));segment(range(7,12),[13,14]);
segment([7,8],range(9,15));segment(range(4,9),[9,10]);
segment([4,5],range(9,15));segment(range(1,6),[13,14]);
segment([1,2],range(5,15));segment(range(1,7),[5,6]);
segment([5,6],range(1,7));segment(range(5,12),[1,2]);
segment([7,8],[11,12],'ice');segment([4,5],[11,12],'ice');
segment([1,2],[9,10],'ice');segment([5,6],[3,4],'dirt');
segment([7,8],[7,8],'void');
const cps=[[640,640,14,128],[832,576,128,14],[576,64,14,128],[64,512,128,14]];
const boosts=[[12,10],[10,5]], finish=512, cols=['#f07573','#5db4ef'];
const starts=[[5.5*64,10.35*64],[5.5*64,11.35*64]];
const keys=new Set();let state='menu',winner=0,cars=[];
const fill=(color,x,y,w,h)=>{g.fillStyle=color;g.fillRect(x,y,w,h)};
// Tous les motifs ci-dessous sont dessines en pixels sur le canvas.
// Aucun fichier image externe ni illustration generative dans le jeu.
function polygon(color,points){g.fillStyle=color;g.beginPath();g.moveTo(...points[0]);
  for(const point of points.slice(1))g.lineTo(...point);g.closePath();g.fill()}
function pine(x,y){
  fill('#687d82',x-25,y+18,50,6);fill('#5f4a49',x-5,y+4,10,21);
  for(const [w,dy] of [[46,-40],[57,-18],[67,1]]){
    polygon('#2c6f76',[[x,dy+y-29],[x-w/2,dy+y+12],[x+w/2,dy+y+12]]);
    fill('#4f9698',x-w/2+7,y+dy+2,w-14,7);
    fill('#f2f9fa',x-w/2+9,y+dy+7,19,4);
  }
}
function cabin(x,y){
  fill('#7e9da7',x-48,y+32,97,10);fill('#7f584d',x-40,y-8,80,47);
  fill('#b57e60',x-34,y-4,69,36);
  polygon('#315262',[[x-55,y-8],[x,y-52],[x+55,y-8]]);
  polygon('#ebf5f6',[[x-48,y-14],[x,y-50],[x+48,y-14],[x+35,y-14],[x,y-38],[x-35,y-14]]);
  fill('#425567',x-10,y+8,21,25);fill('#f5d47f',x+17,y+4,13,11);
  fill('#2d4055',x+19,y+5,9,9);fill('#f5fafa',x+16,y-53,8,18);
}
function frozenLake(x,y){
  fill('#195677',x,y,128,128);fill('#367d9b',x+8,y+8,112,112);
  fill('#1e6282',x+17,y+15,94,93);
  for(const [dx,dy]of [[28,42],[60,72],[83,33]]){
    fill('#71bbd1',x+dx,y+dy,21,5);fill('#b7e1e3',x+dx+8,y+dy-12,4,18);
  }fill('#cde8ee',x+10,y+10,107,4);
}
function snowman(x,y){
  g.fillStyle='#f5fbfb';g.beginPath();g.arc(x,y+8,18,0,Math.PI*2);g.fill();
  g.fillStyle='#f8fcfc';g.beginPath();g.arc(x,y-12,13,0,Math.PI*2);g.fill();
  fill('#233643',x-11,y-32,22,6);fill('#233643',x-7,y-44,14,14);
  fill('#2b353f',x-6,y-16,3,3);fill('#2b353f',x+4,y-16,3,3);
  fill('#e28442',x,y-9,10,4);
}
function rock(x,y){
 polygon('#7e97a8',[[x-18,y+9],[x-9,y-9],[x+9,y-13],[x+22,y+9]]);
 polygon('#e1eef1',[[x-16,y+2],[x-9,y-10],[x+8,y-11],[x+13,y+2]]);
 fill('#5d798b',x-18,y+8,40,4);
}
function warning(x,y){
 polygon('#3a4d5a',[[x,y-21],[x+21,y],[x,y+21],[x-21,y]]);
 polygon('#f9d25a',[[x,y-16],[x+16,y],[x,y+16],[x-16,y]]);
 fill('#323c44',x-2,y-9,5,12);fill('#323c44',x-2,y+8,5,4);
 fill('#485f6f',x-3,y+22,6,13);
}
function tileType(x,y){let c=Math.floor(x/64),r=Math.floor(y/64);
  return r>=0&&r<12&&c>=0&&c<16?map[r][c]:'void'}
const bg=document.createElement('canvas');bg.width=W;bg.height=H;const mainG=g;
function paintBackground(){
  g.clearRect(0,0,W,H);
  for(let r=0;r<12;r++)for(let c=0;c<16;c++){
    const t=map[r][c],x=c*64,y=r*64;
    const color=t==='road'?ROAD:t==='ice'?'#74cce3':t==='dirt'?'#9b8475':
      t==='void'?'#1c4f6f':(r+c)%3===0?'#d7e8ef':GRASS;
    fill(color,x,y,64,64);
    if(t==='grass'){fill('#ebf6f7',x+9,y+16,25,4);fill('#b1cfdf',x+35,y+45,19,4)}
    if(t==='road')fill('#3a4656',x+18,y+19,14,3);
    if(t==='ice'){fill('#bff1f4',x+7,y+14,30,4);fill('#44a5c7',x+34,y+40,21,4)}
    if(t==='dirt')fill('#b8a196',x+10,y+18,22,5);
    if(t==='void')fill('#337292',x+11,y+15,30,7);
  }
  // Bordures pixel art, posees uniquement le long de la route.
  for(let r=0;r<12;r++)for(let c=0;c<16;c++){
    if(!['road','dirt','ice'].includes(map[r][c]))continue;
    const x=c*64,y=r*64;
    for(const [dc,dr,side]of [[-1,0,'left'],[1,0,'right'],[0,-1,'top'],[0,1,'bottom']]){
      if(['road','dirt','ice'].includes(map[r+dr]?.[c+dc]))continue;
      for(let part=0;part<4;part++){
        const col=(part+c+r)%2?'#f6fbfa':'#c84a54';
        if(side==='left')fill(col,x,y+part*16,9,16);
        else if(side==='right')fill(col,x+55,y+part*16,9,16);
        else if(side==='top')fill(col,x+part*16,y,16,9);
        else fill(col,x+part*16,y+55,16,9);
      }
    }
  }
  for(let x=188;x<842;x+=54)fill('#93a3b0',x,703,25,4);
  for(let x=384;x<837;x+=56)fill('#93a3b0',x,126,25,4);
  for(let x=645;x<838;x+=50){fill('#93a3b0',x,318,21,4);fill('#93a3b0',x,510,21,4)}
  for(let x=188;x<350;x+=49)fill('#93a3b0',x,383,22,4);
  for(let y=450;y<622;y+=49)fill('#93a3b0',126,y,4,22);
  for(let y=206;y<355;y+=46)fill('#93a3b0',382,y,4,21);
  for(let y=335;y<504;y+=46)fill('#93a3b0',638,y,4,22);
  for(const y of [217,265,574,623])fill('#93a3b0',894,y,4,21);
  for(const p of [[152,213],[239,245],[260,567],[342,563],[492,240],[758,221],[776,423],[1002,266]])pine(...p);
  cabin(501,364);frozenLake(448,448);snowman(207,280);warning(786,419);
  for(const p of [[44,176],[302,288],[506,565],[735,427],[974,564]])rock(...p);
  // Ligne de depart, perpendiculaire a la conduite dans la ligne droite du bas.
  for(let y=640;y<768;y+=12)for(let x=504;x<520;x+=8){
    fill(((y-640)/12+(x-504)/8)%2?'#f7fafa':'#1e2632',x,y,8,Math.min(12,768-y));
  }
}
paintBackground();const bkgImage=new Image();bkgImage.src=cv.toDataURL('image/png');
function makeCar(x,y,color){return {x,y,angle:0,vx:0,vy:0,color,laps:0,cp:0,last:[x,y],boost:0,cd:0,cpFlash:0}}
function restart(){cars=starts.map(([x,y],i)=>makeCar(x,y,cols[i]));winner=0;state='racing';cv.focus()}
const inside=(c,rect)=>c.x>=rect[0]&&c.x<rect[0]+rect[2]&&c.y>=rect[1]&&c.y<rect[1]+rect[3];
function physics(car,dt,p){let t=tileType(car.x,car.y),props={road:[310,270,5.5,.9],grass:[150,120,1.8,2.4],dirt:[155,145,1.2,1.6],ice:[100,245,.3,.35]};
  let [acc,max,grip,drag]=props[t]||props.grass;
  let fx=Math.cos(car.angle),fy=Math.sin(car.angle),along=car.vx*fx+car.vy*fy;
  let steer=(p.right?1:0)-(p.left?1:0);
  if(Math.abs(along)>5)car.angle+=steer*Math.sign(along)*(1+Math.min(Math.abs(along)/150,1))*1.35*dt;
  fx=Math.cos(car.angle);fy=Math.sin(car.angle);
  if(car.boost>0){acc*=1.55;max*=1.25}
  let gas=(p.up?1:0)-(p.down?1:0);
  car.vx+=fx*gas*acc*dt;car.vy+=fy*gas*acc*dt;
  along=car.vx*fx+car.vy*fy;
  let k=Math.exp(-grip*dt),f=Math.exp(-drag*dt);
  car.vx=(along*fx+(car.vx-along*fx)*k)*f;
  car.vy=(along*fy+(car.vy-along*fy)*k)*f;
  let v=Math.hypot(car.vx,car.vy);
  if(v>max){car.vx*=max/v;car.vy*=max/v}
  let old=car.x;car.x+=car.vx*dt;car.y+=car.vy*dt;
  car.boost=Math.max(0,car.boost-dt);car.cd=Math.max(0,car.cd-dt);car.cpFlash=Math.max(0,car.cpFlash-dt);
  if(tileType(car.x,car.y)==='void'){[car.x,car.y]=car.last;car.vx=car.vy=0;return}
  if(car.cp<4&&inside(car,cps[car.cp])){car.cp++;car.last=[car.x,car.y];car.cpFlash=1.2}
  if(old<finish&&car.x>=finish&&car.y>640&&car.y<768&&car.cp===4){
    car.laps++;car.cp=0;
    if(car.laps>=3){winner=cars.indexOf(car)+1;state='finished'}
  }
  for(const [bc,br]of boosts)if(Math.floor(car.x/S)===bc&&Math.floor(car.y/S)===br&&car.cd<=0){
    car.boost=.9;car.cd=3;
    // Acceleration immediate pour que le joueur sente le boost.
    car.vx+=Math.cos(car.angle)*110;
    car.vy+=Math.sin(car.angle)*110;
    let speed=Math.hypot(car.vx,car.vy);
    if(speed>330){car.vx*=330/speed;car.vy*=330/speed}
  }
}
function drawBlocks(){g.textAlign='center';g.textBaseline='middle';g.font='bold 14px monospace';
  cps.forEach(([x,y,w,h],i)=>{fill('rgba(60,158,207,.25)',x,y,w,h);
    g.strokeStyle='#9ee5ef';g.lineWidth=3;g.strokeRect(x,y,w,h);
    g.fillStyle='#f4ffff';g.fillText('C'+(i+1),x+w/2,y+h/2)});
  // Bloc jaune B : boost, pas une fleche de direction.
  for(const [col,row]of boosts){let x=col*S+32,y=row*S+32;
    fill('#374050',x-22,y-22,44,44);fill('#ffcb4a',x-18,y-18,36,36);fill('#ffe369',x-15,y-15,30,7);
    g.fillStyle='#303a47';g.fillText('B',x,y+1)}
}
function drawCar(c){g.save();g.translate(c.x,c.y);g.rotate(c.angle);
  fill('#223038',-20,-15,39,30);fill(c.color,-20,-11,39,22);
  fill('#f6edcf',-9,-8,13,16);fill('#385e6d',-1,-8,7,16);fill('#f5d981',16,-8,5,16);
  fill('#223038',-13,-17,13,6);fill('#223038',-13,11,13,6);
  g.restore()}
function label(text,x,y,color='#f5fafd',font='bold 18px monospace'){
  g.font=font;g.textAlign='left';g.textBaseline='alphabetic';
  g.fillStyle='#193446';g.fillText(text,x+2,y+2);g.fillStyle=color;g.fillText(text,x,y)}
function overlay(title,subtitle,instructions){fill('rgba(19,47,64,.65)',0,0,W,H);
  fill('#1f4254',216,248,592,260);g.strokeStyle='#75c0d9';g.lineWidth=4;g.strokeRect(216,248,592,260);
  g.textAlign='center';g.textBaseline='middle';g.fillStyle='#f5fafd';g.font='bold 42px monospace';g.fillText(title,512,320);
  g.font='bold 18px monospace';g.fillStyle='#d6ebdc';g.fillText(subtitle,512,388);
  g.font='bold 14px monospace';g.fillText(instructions,512,458)}
function draw(){g.drawImage(bkgImage,0,0);drawBlocks();cars.forEach(drawCar);
  fill('#1d364b',13,7,998,60);g.strokeStyle='#62a1bb';g.lineWidth=3;g.strokeRect(13,7,998,60);
  label('GLACIAL RUN',28,38,'#edfcff');
  cars.forEach((c,i)=>{
    const x=i?712:415;
    label('J'+(i+1)+': '+Math.min(c.laps+1,3)+'/3 tours',x,29,c.color,'bold 17px monospace');
    label('C: '+c.cp+'/4',x,52,c.color,'bold 14px monospace');
    if(c.boost>0) label('BOOST !',x+80,52,'#f7cd5b','bold 14px monospace');
    else if(c.cpFlash>0)label('C'+c.cp+' OK !',x+80,52,'#a4e9e0','bold 14px monospace');
  });
  if(state==='menu')overlay('MINI KART','GLACIAL - DIFFICILE','ENTREE : JOUER  |  ZQSD + FLECHES');
  if(state==='finished')overlay('JOUEUR '+winner+' GAGNE !','COURSE TERMINEE','ENTREE : REJOUER')}
function controls(i){return i===0?{up:keys.has('z')||keys.has('w'),down:keys.has('s'),left:keys.has('q')||keys.has('a'),right:keys.has('d')}:
  {up:keys.has('ArrowUp'),down:keys.has('ArrowDown'),left:keys.has('ArrowLeft'),right:keys.has('ArrowRight')}}
function frame(ts){if(!frame.prev)frame.prev=ts;let dt=Math.min((ts-frame.prev)/1000,.05);frame.prev=ts;
  if(state==='racing')cars.forEach((car,i)=>physics(car,dt,controls(i)));
  draw();requestAnimationFrame(frame)}
window.addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();
  if(k==='Enter'&&state!=='racing'){restart();e.preventDefault()}
  else if(k==='r')restart();else if(k==='Escape'){state='menu'}
  keys.add(k)});
window.addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));
window.addEventListener('blur',()=>keys.clear());
document.getElementById('play').addEventListener('click',restart);
document.getElementById('focus').addEventListener('click',()=>cv.focus());
cars=starts.map(([x,y],i)=>makeCar(x,y,cols[i]));
if(new URLSearchParams(location.search).has('preview'))state='racing';
cv.focus();requestAnimationFrame(frame);
</script>
</body>
</html>
