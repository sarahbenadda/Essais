const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d');
const imgs=sources.map(src=>{const a=new Image();a.src=src;return a;});
const positions=[[415,670],[415,670],[890,225]];
let index=0,car={x:415,y:670,angle:0,speed:0};let pressed={};
function reset(){car={x:positions[index][0],y:positions[index][1],angle:index===2?0:Math.PI/2,speed:0};canvas.focus();}
function choose(i){index=i;document.querySelectorAll('[data-i]').forEach(b=>b.classList.toggle('sel',Number(b.dataset.i)===i));reset();}
document.querySelectorAll('[data-i]').forEach(b=>b.addEventListener('click',()=>choose(Number(b.dataset.i))));
document.getElementById('reset').addEventListener('click',reset);
const keyName=(key)=>key.toLowerCase();
window.addEventListener('keydown',e=>{let k=keyName(e.key);if(['arrowup','arrowdown','arrowleft','arrowright','z','q','s','d'].includes(k)){pressed[k]=true;e.preventDefault();}});
window.addEventListener('keyup',e=>{pressed[keyName(e.key)]=false;});
window.addEventListener('blur',()=>{pressed={};});
function drawCar(){ctx.save();ctx.translate(car.x,car.y);ctx.rotate(car.angle);ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(-13,-20,31,47);ctx.fillStyle='#e73d38';ctx.fillRect(-14,-22,28,43);ctx.fillStyle='#abd8fc';ctx.fillRect(-10,-14,20,12);ctx.fillStyle='#f6ebdf';ctx.fillRect(-9,9,18,6);ctx.restore();}
let last=performance.now();function frame(now){const dt=Math.min((now-last)/16.6667,3);last=now;
if(pressed.arrowup||pressed.z)car.speed+=.13*dt;
if(pressed.arrowdown||pressed.s)car.speed-=.11*dt;
car.speed=Math.max(-3,Math.min(5,car.speed));
if(pressed.arrowleft||pressed.q)car.angle-=.049*dt;
if(pressed.arrowright||pressed.d)car.angle+=.049*dt;
car.x+=Math.sin(car.angle)*car.speed*dt;
car.y-=Math.cos(car.angle)*car.speed*dt;
car.speed*=Math.pow(.983,dt);
car.x=Math.max(5,Math.min(1019,car.x));car.y=Math.max(5,Math.min(763,car.y));
ctx.clearRect(0,0,1024,768);
if(imgs[index].complete&&imgs[index].naturalWidth)ctx.drawImage(imgs[index],0,0,1024,768);
drawCar();requestAnimationFrame(frame);}
reset();requestAnimationFrame(frame);
</script></body></html>
